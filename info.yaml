# Tiny Tapeout project information
project:
  title:        "A simple 8-bit multicycle CPU"      # Project title
  author:       "Obookstay"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit multicycle CPU with a UART program loader, GPIO and UART memory-mapped IO"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     48000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_obookstay_cpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "cpu_defines.v"
    - "cpu_core.v"
    - "cpu_top.v"
    - "uart_rx.v"
    - "uart_tx.v"
    - "tt_um_obookstay_cpu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "UART RX (115200 8N1, boot loader / program input)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "UART TX (115200 8N1, program output)"
  uo[1]: "LED R (boot / loading)"
  uo[2]: "LED G (running)"
  uo[3]: "LED B (halted)"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "CPU GPIO out bit 0"
  uio[1]: "CPU GPIO out bit 1"
  uio[2]: "CPU GPIO out bit 2"
  uio[3]: "CPU GPIO out bit 3"
  uio[4]: "CPU GPIO out bit 4"
  uio[5]: "CPU GPIO out bit 5"
  uio[6]: "CPU GPIO out bit 6"
  uio[7]: "CPU GPIO out bit 7"

# Do not change!
yaml_version: 6
